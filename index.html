<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>LutCraft</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700&display=swap">
<style>
:root{
  --bg:#0b0f0e; --surface:rgba(255,255,255,.05); --line:rgba(255,255,255,.10);
  --text:#e9f1ee; --muted:#8b9a95; --accent:#2cffa0; --accent-ink:#04120c; --diamond:#4fd8ff;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;min-height:100vh;background:var(--bg);color:var(--text);font-family:'Sora',system-ui,-apple-system,'Segoe UI',sans-serif;
  background-image:radial-gradient(520px 320px at 85% -5%,rgba(44,255,160,.14),transparent 70%),radial-gradient(420px 300px at -10% 30%,rgba(79,216,255,.09),transparent 70%);
  background-repeat:no-repeat}
#app{max-width:520px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;padding:20px 16px 0}
button{font:inherit;color:inherit;cursor:pointer;border:0}
button:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* Header */
.header{display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{display:flex;align-items:center;gap:10px}
.logo{width:38px;height:38px;border-radius:11px;background:linear-gradient(135deg,var(--accent),var(--diamond));display:grid;place-items:center}
.brand h1{margin:0;font-size:22px;font-weight:700;letter-spacing:-.02em}
.btn-update{background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:9px 14px;font-size:13px;font-weight:600;display:flex;gap:6px;align-items:center;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
.btn-update:active{transform:scale(.97)}
.tagline{margin:18px 0 16px;color:var(--muted);font-size:14px;line-height:1.5}

/* Filter */
.filter{display:grid;grid-template-columns:1fr 1fr;gap:6px;padding:5px;border-radius:16px;background:var(--surface);border:1px solid var(--line);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
.tab{padding:12px;border-radius:12px;background:transparent;font-weight:600;font-size:14px;color:var(--muted);transition:background .2s,color .2s}
.tab[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.count{margin:18px 2px 10px;font-size:13px;color:var(--muted)}

/* Cards */
.list{display:grid;gap:16px}
.card{border-radius:22px;overflow:hidden;background:var(--surface);border:1px solid var(--line);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
.card-img{position:relative;aspect-ratio:16/9;background:#101716}
.card-img img{width:100%;height:100%;object-fit:cover;display:block}
.badge{position:absolute;top:12px;left:12px;padding:5px 11px;border-radius:999px;font-size:12px;font-weight:600;background:rgba(8,12,11,.72);border:1px solid var(--line);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.badge[data-cat="Add-ons"]{color:var(--accent)}
.badge[data-cat="Shaders"]{color:var(--diamond)}
.card-body{padding:16px}
.card-body h2{margin:0 0 6px;font-size:17px;font-weight:600;letter-spacing:-.01em}
.card-body p{margin:0 0 14px;color:var(--muted);font-size:13.5px;line-height:1.55}
.btn-dl{width:100%;padding:13px;border-radius:14px;background:linear-gradient(135deg,var(--accent),#19d98a);color:var(--accent-ink);font-weight:700;font-size:14px;display:flex;justify-content:center;align-items:center;gap:8px;transition:transform .15s,box-shadow .2s;box-shadow:0 8px 24px -10px rgba(44,255,160,.6)}
.btn-dl:active{transform:scale(.98)}
.empty{padding:32px 16px;text-align:center;color:var(--muted);font-size:14px;border:1px dashed var(--line);border-radius:18px}

/* Footer */
.spacer{flex:1}
.footer{margin:36px -16px 0;padding:22px 16px calc(22px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line);background:rgba(255,255,255,.03);display:flex;align-items:center;justify-content:space-between;gap:14px}
.footer strong{display:block;font-size:15px}
.footer span{font-size:12.5px;color:var(--muted)}
.btn-donate{padding:11px 18px;border-radius:999px;background:var(--surface);border:1px solid var(--accent);color:var(--accent);font-weight:700;font-size:14px;white-space:nowrap}

/* Modal */
.overlay{position:fixed;inset:0;z-index:20;display:grid;place-items:center;padding:20px;background:rgba(3,6,5,.7);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);animation:fade .2s ease-out}
.modal{width:100%;max-width:340px;padding:22px;border-radius:26px;text-align:center;background:rgba(18,26,24,.92);border:1px solid var(--line);animation:pop .22s ease-out}
.modal h3{margin:0 0 4px;font-size:18px}
.modal p{margin:0 0 16px;color:var(--muted);font-size:13px}
.qr{width:100%;aspect-ratio:1;border-radius:16px;background:#fff;padding:10px;display:block;object-fit:contain}
.btn-close{margin-top:16px;width:100%;padding:12px;border-radius:14px;background:var(--surface);border:1px solid var(--line);font-weight:600}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes pop{from{opacity:0;transform:translateY(12px) scale(.97)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="app"></div>

<script>
/* =====================================================
   1. KONFIGURASI — ubah data aplikasi di sini saja
   ===================================================== */
const CONFIG = {
  appName: "LutCraft",
  whatsappChannel: "https://whatsapp.com/channel/0029VbER23dA2pL9EG6JyH0v",
  donation: { qrImage: "https://files.catbox.moe/mhfru8.jpeg" }, // URL .jpg / .png
  items: [
    { id: 1, category: "Add-ons", title: "Action Stuff V 2.0",
      description: "",
      image: "https://files.catbox.moe/hs0s84.jpg", downloadUrl: "https://www.mediafire.com/file/6r49bewfqcgiegp/Actions-And-Stuff-2.0.mcpack/file" },
    { id: 2, category: "Add-ons", title: "rc toys",
      description: "",
      image: "https://files.catbox.moe/ilos35.jpg", downloadUrl: "https://www.mediafire.com/file/naqj0jknoduk92x/rc+toys+@LutCraft.zip/file" },
    { id: 3, category: "Add-ons", title: "Cursed Villager",
      description: "",
      image: "https://files.catbox.moe/dobjcy.jpg", downloadUrl: "https://www.mediafire.com/file/q68igaa0z5u5qfc/Cursed+Villagers+LutCraft.mcaddon.zip/file" },
    { id: 4, category: "Shaders", title: "newb x zenit",
      description: "",
      image: "https://files.catbox.moe/6vuxl8.jpg", downloadUrl: "https://www.mediafire.com/file/vrkk6tgvn9lkqrl/newb+x+zenit+LutCraft.mcpack/file" },
    { id: 5, category: "Shaders", title: "newbxm",
      description: "",
      image: "https://files.catbox.moe/ckm1wq.jpg", downloadUrl: "https://www.mediafire.com/file/ub63eu38fn4nr4z/AndNewbXMJv+LutCraft.mcpack.zip/file" },
   { id: 6, category: "Add-ons", title: "better sound",
      description: "",
      image: "https://files.catbox.moe/nnhz3i.jpg", downloadUrl: "https://www.mediafire.com/file/0xhysxrxfao7y4y/Better+Sounds+LutCraft.mcpack.zip/file" }
  ]
  ]
};
const FILTERS = ["Add-ons", "Shaders"];

/* =====================================================
   2. STATE — satu sumber kebenaran + render ulang
   ===================================================== */
const state = { filter: null, donateOpen: false }; // filter null = semua

function setState(patch) { Object.assign(state, patch); render(); }
const toggleFilter = (name) => setState({ filter: state.filter === name ? null : name });
const visibleItems = () => CONFIG.items.filter(i => !state.filter || i.category === state.filter);

/* =====================================================
   3. UTILITAS
   ===================================================== */
const esc = (s) => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const openLink = (url) => window.open(url, "_blank", "noopener");
const placeholder = (label) => "data:image/svg+xml;utf8," + encodeURIComponent(
  `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180"><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#12342a"/><stop offset="1" stop-color="#0d2a36"/></linearGradient></defs><rect width="320" height="180" fill="url(#g)"/><rect x="136" y="66" width="48" height="48" rx="8" fill="none" stroke="#2cffa0" stroke-opacity=".6" stroke-width="3"/><text x="160" y="140" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#8b9a95">${esc(label)}</text></svg>`);

const ICON = {
  logo: `<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#04120c" stroke-width="2.4" stroke-linejoin="round"><path d="M12 3l8 4.5v9L12 21l-8-4.5v-9z"/><path d="M12 12l8-4.5M12 12L4 7.5M12 12v9"/></svg>`,
  bell: `<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 8a6 6 0 1 1 12 0c0 7 3 8 3 8H3s3-1 3-8M10 21h4"/></svg>`,
  download: `<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v11m0 0l-4-4m4 4l4-4M5 20h14"/></svg>`
};

/* =====================================================
   4. KOMPONEN — fungsi murni yang mengembalikan HTML
   ===================================================== */
const Header = () => `
  <header class="header">
    <div class="brand"><div class="logo">${ICON.logo}</div><h1>${esc(CONFIG.appName)}</h1></div>
    <button class="btn-update" data-action="update">${ICON.bell} Saluran</button>
  </header>
  <p class="tagline">Add-on dan shaders Minecraft pilihan, siap diunduh.</p>`;

const FilterTabs = () => `
  <nav class="filter" aria-label="Filter konten">
    ${FILTERS.map(f => `<button class="tab" data-action="filter" data-value="${f}" aria-pressed="${state.filter === f}">${f}</button>`).join("")}
  </nav>`;

const ContentCard = (item) => `
  <article class="card">
    <div class="card-img">
      <img src="${esc(item.image)}" alt="${esc(item.title)}" loading="lazy" data-fallback="${esc(item.category)}">
      <span class="badge" data-cat="${esc(item.category)}">${esc(item.category)}</span>
    </div>
    <div class="card-body">
      <h2>${esc(item.title)}</h2>
      <p>${esc(item.description)}</p>
      <button class="btn-dl" data-action="download" data-id="${item.id}">${ICON.download} Download</button>
    </div>
  </article>`;

const CardList = () => {
  const items = visibleItems();
  return `
    <div class="count">${items.length} konten${state.filter ? " · " + state.filter : ""}</div>
    <section class="list">${items.length ? items.map(ContentCard).join("") : `<div class="empty">Belum ada konten di kategori ini.</div>`}</section>`;
};

const Footer = () => `
  <footer class="footer">
    <div><strong>Dukung LutCraft</strong><span>Donasi membantu kami terus update.</span></div>
    <button class="btn-donate" data-action="donate">Donasi</button>
  </footer>`;

const DonateModal = () => !state.donateOpen ? "" : `
  <div class="overlay" data-action="close-overlay" role="dialog" aria-modal="true" aria-label="Donasi">
    <div class="modal">
      <h3>Donasi</h3>
      <p>Scan kode QR untuk mendukung LutCraft.</p>
      <img class="qr" src="${esc(CONFIG.donation.qrImage)}" alt="Kode QR donasi" data-fallback="Kode QR">
      <button class="btn-close" data-action="close">Tutup</button>
    </div>
  </div>`;

/* =====================================================
   5. RENDER + EVENT (delegasi)
   ===================================================== */
function render() {
  document.getElementById("app").innerHTML =
    Header() + FilterTabs() + CardList() + `<div class="spacer"></div>` + Footer() + DonateModal();
  document.querySelectorAll("img[data-fallback]").forEach(img => {
    img.addEventListener("error", () => { img.src = placeholder(img.dataset.fallback); }, { once: true });
  });
}

document.getElementById("app").addEventListener("click", (e) => {
  const el = e.target.closest("[data-action]");
  if (!el) return;
  const a = el.dataset.action;
  if (a === "filter") toggleFilter(el.dataset.value);
  else if (a === "download") openLink(CONFIG.items.find(i => i.id == el.dataset.id).downloadUrl);
  else if (a === "update") openLink(CONFIG.whatsappChannel);
  else if (a === "donate") setState({ donateOpen: true });
  else if (a === "close") setState({ donateOpen: false });
  else if (a === "close-overlay" && e.target === el) setState({ donateOpen: false });
});
document.addEventListener("keydown", (e) => { if (e.key === "Escape" && state.donateOpen) setState({ donateOpen: false }); });

render();
</script>
</body>
</html>
